<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Left Pan (Cyan - Market Probability) -->
    <linearGradient id="themisCyan" x1="1.5" y1="17" x2="8.5" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Right Pan (Emerald - Oracle Resolution) -->
    <linearGradient id="themisEmerald" x1="23.5" y1="17" x2="30.5" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Pillar / Metal Gradients -->
    <linearGradient id="pillarGold" x1="16" y1="1.5" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Beam Gradient -->
    <linearGradient id="beamMetal" x1="4" y1="8" x2="28" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Central Spearhead / Greek Apex Pediment -->
  <polygon points="16,1.5 19,6.5 13,6.5" fill="url(#pillarGold)" />

  <!-- Central Pillar / Sword of Justice -->
  <line x1="16" y1="7" x2="16" y2="26.5" stroke="url(#pillarGold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Classical Greek Pedestal Base -->
  <line x1="12.5" y1="26.5" x2="19.5" y2="26.5" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" />
  <line x1="10" y1="29" x2="22" y2="29" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Balance Beam -->
  <line x1="4.5" y1="8" x2="27.5" y2="8" stroke="url(#beamMetal)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Fulcrum Hub Ring -->
  <circle cx="16" cy="8" r="2.4" fill="#0b101c" stroke="#f8fafc" stroke-width="1.2" />
  <circle cx="16" cy="8" r="0.9" fill="#38bdf8" />

  <!-- Pivot Caps -->
  <circle cx="4.8" cy="8" r="1.3" fill="#38bdf8" />
  <circle cx="27.2" cy="8" r="1.3" fill="#34d399" />

  <!-- ─── LEFT SCALE: CYAN (Market Odds) ─── -->
  <!-- Suspension Cords -->
  <line x1="4.8" y1="9.3" x2="1.8" y2="17.2" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" opacity="0.9" />
  <line x1="4.8" y1="9.3" x2="8.8" y2="17.2" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" opacity="0.9" />
  <!-- Cyan Vessel / Pan -->
  <polygon points="1.2,17.2 9.2,17.2 7.6,22 2.8,22" fill="url(#themisCyan)" stroke="#38bdf8" stroke-width="0.7" />
  <!-- Market Token Orb -->
  <circle cx="5.2" cy="15.2" r="1.7" fill="#22d3ee" />
  <circle cx="5.2" cy="15.2" r="0.7" fill="#ffffff" />

  <!-- ─── RIGHT SCALE: EMERALD (Oracle Verdict) ─── -->
  <!-- Suspension Cords -->
  <line x1="27.2" y1="9.3" x2="23.2" y2="17.2" stroke="#34d399" stroke-width="0.9" stroke-linecap="round" opacity="0.9" />
  <line x1="27.2" y1="9.3" x2="30.2" y2="17.2" stroke="#34d399" stroke-width="0.9" stroke-linecap="round" opacity="0.9" />
  <!-- Emerald Vessel / Pan -->
  <polygon points="22.8,17.2 30.8,17.2 29.2,22 24.4,22" fill="url(#themisEmerald)" stroke="#34d399" stroke-width="0.7" />
  <!-- Verdict Token Orb -->
  <circle cx="26.8" cy="15.2" r="1.7" fill="#34d399" />
  <circle cx="26.8" cy="15.2" r="0.7" fill="#ffffff" />
</svg>